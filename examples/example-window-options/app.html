<div class="wo">
  <h2>Window Options</h2>
  <p class="wo-sub">These buttons drive <b>this</b> window at runtime.</p>

  <div class="wo-sec">Size</div>
  <div class="wo-grid">
    <button data-act="mobile">Mobile 390×760</button>
    <button data-act="desktop">Desktop 900×600</button>
    <button data-act="center">Center</button>
  </div>

  <div class="wo-sec">State</div>
  <div class="wo-grid">
    <button data-act="maximize">Maximize</button>
    <button data-act="restore">Restore</button>
    <button data-act="minimize">Minimize</button>
  </div>

  <div class="wo-sec">Chrome</div>
  <div class="wo-grid">
    <button data-act="resizable-off">Resizable: off</button>
    <button data-act="resizable-on">Resizable: on</button>
    <button data-act="title">Rename title</button>
  </div>

  <div class="wo-sec">Web view (fixed mobile window)</div>
  <div class="wo-grid">
    <button data-act="dbnlink" class="wo-primary">Open dbnlink.com (mobile)</button>
  </div>

  <p class="wo-note">Tip: initial size &amp; locks are set in <code>manifest.json → window</code>.</p>
</div>
