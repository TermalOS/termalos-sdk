<div class="ed">
  <div class="ed-bar">
    <button id="ed-new"  title="New">＋ New</button>
    <select id="ed-files" title="Open a file"></select>
    <button id="ed-save" title="Save (Ctrl/Cmd+S)">💾 Save</button>
    <button id="ed-copy" title="Copy all">Copy</button>
    <button id="ed-del"  title="Delete file" class="danger">Delete</button>
    <span class="ed-spacer"></span>
    <span id="ed-status" class="ed-status">no file</span>
  </div>
  <textarea id="ed-area" class="ed-area" placeholder="Type here, then Save…" spellcheck="false"></textarea>
</div>
