<div class="fx">
  <div class="fx-bar">
    <button id="fx-open-file" title="Pick a file">📄 Open a file…</button>
    <button id="fx-open-folder" title="Pick a folder">📁 Open a folder…</button>
    <span class="fx-spacer"></span>
    <span id="fx-status" class="fx-status">Nothing chosen yet</span>
  </div>
  <div id="fx-body" class="fx-body">
    <div class="fx-hint">
      <p><strong>This app can only see what YOU choose.</strong></p>
      <p>Pick a file or a folder above. The picker is the permission: the app receives
         exactly the path you selected - and, for a folder, only what is inside it.
         Nothing else on the server is reachable.</p>
    </div>
  </div>
</div>
