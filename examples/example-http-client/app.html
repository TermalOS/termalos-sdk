<div class="hc">
  <h2>HTTP Client</h2>
  <div class="hc-row">
    <input id="hc-url" value="https://api.github.com/zen" spellcheck="false" />
    <button id="hc-go">GET</button>
  </div>
  <div class="hc-exit">
    <label><input type="radio" name="exit" value="local" checked> This machine</label>
    <label><input type="radio" name="exit" value="server"> Via the server (SSH)</label>
  </div>
  <div id="hc-meta" class="hc-meta"></div>
  <pre id="hc-out" class="hc-out">Response will appear here…</pre>
</div>
